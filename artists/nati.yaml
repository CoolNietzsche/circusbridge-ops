id: nati
stage_name: Nati
discipline: Free-Standing Ladder · Club & Ball Juggling
headline: Juggling clubs at height on a free-standing ladder.
bio: >
  Nati combines two disciplines in one act: balancing on a free-standing ladder
  (no support, no rigging) while juggling clubs and balls. The act has been
  performed in the United Kingdom. Its vertical shape reads well from a
  distance, which suits theatre stages, outdoor festivals and large event
  spaces.
