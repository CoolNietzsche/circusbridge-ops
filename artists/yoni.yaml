id: yoni
stage_name: Yoni
discipline: Juggling · Bounce Juggling · Hat Manipulation
headline: Precision juggling with rhythm, humour and a gold-sequin finish.
bio: >
  Yoni is an Addis Ababa juggler whose act combines bounce juggling (balls
  played off the stage floor in fast rhythmic patterns), classic toss juggling
  and hat manipulation. The act moves from crisp technical sequences to light,
  audience-friendly comedy with a set of colourful hats, which makes it work
  equally well on a theatre stage, at a gala dinner or as a roaming act.
