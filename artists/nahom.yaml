id: nahom
stage_name: Nahom
discipline: Balance · Rola Bola · Apparatus Equilibrium
headline: Controlled, high-tension balance on board, ball, railing and pedestal.
bio: >
  Nahom is a balance specialist from Addis Ababa. His act builds height and
  tension step by step: board-and-ball balance (rola bola style), balancing on
  a railing, and equilibrium on a basketball-on-stand and pedestal apparatus.
  Clean lines, slow-building suspense and a confident stage presence make it a
  strong feature act for theatre productions, galas and resort shows.
